<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/61c4a4816c.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <p class="title-heading">
            SIMPLE CALCULATOR
        </p>
    </header>
    <div class="body-main">
        <div class="search-number">
            <div class="number-container">
                <p class="title-number">
                    NUMBER A
                </p>
                <input type="number" id="number1-input">
            </div>
             <div class="number-container">
                <p class="title-number">
                    NUMBER B
                </p>
                <input type="number" id="number2-input">
            </div>
        </div>
        <div class="calculator-container">
            <div class="calculator-container_btn">
                <button class="calculator-btn" id="sum"><i class="fa-solid fa-plus"></i></button>
                <p class="title-calculator">
                    SUMMATION
                </p>
            </div>
            <div class="calculator-container_btn">
                <button class="calculator-btn" id="sub"><i class="fa-solid fa-minus"></i></button>
                <p class="title-calculator">
                    SUBTRACTION
                </p>
            </div>
            <div class="calculator-container_btn">
                <button class="calculator-btn" id="mup"><i class="fa-solid fa-xmark"></i></button>
                <p class="title-calculator">
                    MUPTIPLICATION
                </p>
            </div>
            <div class="calculator-container_btn">
                <button class="calculator-btn" id="div"><i class="fa-solid fa-slash"></i></button>
                <p class="title-calculator">
                    DIVISION
                </p>
            </div>
        </div>
        <div class="result-container">
            <p class="result-heading">
                RESULT A & B
            </p>
            <div class="result-box" id="result-output">0</div>
        </div>
    </div>
</body>
</html>
